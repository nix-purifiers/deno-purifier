# SPDX-License-Identifier: MIT
#
# Runs every check of the flake on both Linux platforms: the unit tests,
# the fixture builds and the deployctl build in the Nix sandbox, the
# lockfile reader checks, the conformance checks and the formatting check.
# The conformance-relock job locks the test projects again with the
# network, and fails when a lockfile changes.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix flake check -L

  # The `conformance-relock` check of the purifier contract, which needs the
  # network and so runs outside the Nix sandbox.
  conformance-relock:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: tests/relock.sh

  # The `conformance-update` check of the purifier contract, which needs the
  # network and so runs outside the Nix sandbox.
  conformance-update:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: tests/update.sh

  # Original released native SDKs, with real loopback HTTP capture and cold
  # fixed-output fetching. This job deliberately never seeds the Nix store.
  native-epochs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Verify bounded command receipts and cleanup
        run: python3 -B -m unittest discover -s tests -p test_bounded_command.py
      - name: Capture and replay the native SDK epochs
        env:
          DENO_NATIVE_RECEIPTS: ${{ runner.temp }}/deno-native-receipts
        run: tests/native-epochs.sh
      - name: Retain native commands, locks, SDK identities and raw logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deno-native-epochs-${{ github.sha }}
          path: ${{ runner.temp }}/deno-native-receipts
          if-no-files-found: error
